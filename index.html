<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RGB</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
:root{--bg:#07070c;--panel:#12121a;--line:#262633;--muted:#9a9ab0;--nav:rgba(7,7,12,.78);--spec:linear-gradient(90deg,#ff4d6d,#ffd23f,#3ddc97,#4cc9f0,#7b61ff,#ff4d6d)}
[data-bs-theme=light]{--bg:#f6f6fb;--panel:#fff;--line:#e0e0ec;--muted:#5d5d72;--nav:rgba(246,246,251,.82)}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{background:var(--bg);font-family:"Trebuchet MS","Segoe UI",sans-serif;line-height:1.65;transition:background .4s,color .4s}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;letter-spacing:-.01em}
h1{font-size:clamp(2.2rem,6.5vw,4.4rem);line-height:1.08}
.grad-text{background:var(--spec);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:slide 8s linear infinite}
@keyframes slide{to{background-position:250% 0}}
.muted{color:var(--muted)}
section{padding:4.5rem 0;border-top:1px solid var(--line)}
#bar{position:fixed;top:0;left:0;right:0;height:3px;background:var(--spec);transform-origin:0 50%;transform:scaleX(0);z-index:2000}
.navbar{background:var(--nav);backdrop-filter:blur(10px);border-bottom:1px solid transparent;transition:padding .3s,border-color .3s}
.navbar.scrolled{border-color:var(--line)}
.nav-link{position:relative}
.nav-link::after{content:"";position:absolute;left:.5rem;right:.5rem;bottom:2px;height:2px;background:var(--spec);transform:scaleX(0);transition:transform .3s}
.nav-link:hover::after{transform:scaleX(1)}
.pill{border:1px solid var(--line);background:transparent;color:inherit;border-radius:999px;padding:.3rem .8rem;font-size:.9rem;transition:all .25s}
.pill:hover{border-color:currentColor}
.pill.active{background:var(--spec);background-size:200% 100%;color:#fff;border-color:transparent;text-shadow:0 0 3px rgba(0,0,0,.5)}
.btn-grad{background:var(--spec);background-size:250% 100%;color:#fff;border:0;padding:.8rem 1.8rem;border-radius:999px;font-weight:700;text-shadow:0 0 4px rgba(0,0,0,.5);transition:transform .25s,background-position .6s,box-shadow .25s}
.btn-grad:hover{color:#fff;background-position:100% 0;transform:translateY(-3px);box-shadow:0 10px 28px rgba(123,97,255,.4)}
header{position:relative;overflow:hidden}
header::before{content:"";position:absolute;inset:-30%;z-index:-1;opacity:.35;filter:blur(70px);background:conic-gradient(from 0deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);animation:hue 16s linear infinite}
[data-bs-theme=light] header::before{opacity:.22}
@keyframes hue{to{filter:blur(70px) hue-rotate(360deg);transform:rotate(1turn)}}
.venn{position:relative;width:min(340px,80vw);aspect-ratio:1;margin:auto;isolation:isolate;background:#000;border-radius:50%;box-shadow:0 0 60px rgba(120,100,255,.35);animation:spin 28s linear infinite}
.venn i{position:absolute;width:58%;aspect-ratio:1;border-radius:50%;mix-blend-mode:screen;animation:breathe 5s ease-in-out infinite}
.venn .r{background:#f00;left:21%;top:2%}.venn .g{background:#0f0;left:4%;top:36%;animation-delay:-1.6s}.venn .b{background:#00f;left:38%;top:36%;animation-delay:-3.2s}
@keyframes spin{to{transform:rotate(1turn)}}
@keyframes breathe{50%{transform:scale(1.12)}}
.rv{opacity:0;transform:translateY(26px);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:1.4rem;height:100%;transition:border-color .3s,box-shadow .3s,background .4s}
.panel:hover{border-color:#7b61ff;box-shadow:0 12px 32px rgba(123,97,255,.18)}
.chip{width:100%;height:60px;border-radius:12px;border:1px solid var(--line);transition:background .3s}
.swatch{height:80px;border-radius:12px;display:flex;align-items:end;padding:.4rem .6rem;font-size:.85rem;font-weight:700;color:#fff;text-shadow:0 0 4px #000;border:1px solid var(--line);transition:background .4s,transform .3s}
.swatch:hover{transform:translateY(-4px)}
#preview{height:170px;border-radius:16px;border:1px solid var(--line);transition:background .15s,box-shadow .15s}
.wheel-box{position:relative;width:320px;max-width:100%;aspect-ratio:1;margin:auto}
#wheel{width:100%;height:100%;border-radius:50%;cursor:crosshair;background:conic-gradient(from 0deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);-webkit-mask:radial-gradient(circle,transparent 28%,#000 28.5%);mask:radial-gradient(circle,transparent 28%,#000 28.5%)}
#wsvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#wsvg circle{transition:cx .5s,cy .5s,fill .5s}
.mix-eq{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
.mix-eq .chip{width:56px;height:56px}
input[type=color]{width:64px;height:44px;padding:2px;background:transparent;border:1px solid var(--line);border-radius:10px}
.s-r::-webkit-slider-thumb{background:#f33}.s-g::-webkit-slider-thumb{background:#2c6}.s-b::-webkit-slider-thumb{background:#38f}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #7b61ff;outline-offset:2px}
@media(prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}html{scroll-behavior:auto}}
</style>
</head>
<body>
<div id="bar"></div>

<nav class="navbar navbar-expand-lg sticky-top">
  <div class="container">
    <a class="navbar-brand fw-bold grad-text" href="#top">RGB</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav" aria-label="Menu"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="#what" data-i18n="n1"></a></li>
        <li class="nav-item"><a class="nav-link" href="#mixer" data-i18n="n2"></a></li>
        <li class="nav-item"><a class="nav-link" href="#mix" data-i18n="n3"></a></li>
        <li class="nav-item"><a class="nav-link" href="#wheel-sec" data-i18n="n4"></a></li>
      </ul>
      <div class="d-flex gap-2 align-items-center py-2 py-lg-0">
        <div class="d-flex gap-1" id="langs">
          <button class="pill" data-l="ru">RU</button><button class="pill" data-l="uz">UZ</button><button class="pill" data-l="en">EN</button>
        </div>
        <button class="pill" id="theme" aria-label="Theme">☾</button>
      </div>
    </div>
  </div>
</nav>

<header class="container py-5" id="top">
  <div class="row align-items-center g-5 py-lg-4">
    <div class="col-md-7">
      <h1 class="grad-text" data-i18n="h1"></h1>
      <p class="fs-5 muted my-4" data-i18n="hp"></p>
      <a href="#mixer" class="btn btn-grad btn-lg" data-i18n="hb"></a>
    </div>
    <div class="col-md-5"><div class="venn" role="img"><i class="r"></i><i class="g"></i><i class="b"></i></div></div>
  </div>
</header>

<section id="what"><div class="container">
  <h2 class="mb-4" data-i18n="wh"></h2>
  <div class="row g-4">
    <div class="col-lg-6"><p data-i18n="w1"></p><p data-i18n="w2"></p><p data-i18n="w3"></p></div>
    <div class="col-lg-6"><div class="panel"><h3 class="h5" data-i18n="ph"></h3><p class="muted" data-i18n="p1"></p><p class="muted mb-0" data-i18n="p2"></p></div></div>
  </div>
</div></section>

<section id="mixer"><div class="container">
  <h2 class="mb-2" data-i18n="mh"></h2>
  <p class="muted mb-4" data-i18n="mp"></p>
  <div class="row g-4 align-items-center">
    <div class="col-md-6">
      <label for="R" class="form-label"><span data-i18n="cR"></span>: <b id="Rv">255</b></label>
      <input type="range" class="form-range s-r" id="R" min="0" max="255" value="255">
      <label for="G" class="form-label"><span data-i18n="cG"></span>: <b id="Gv">120</b></label>
      <input type="range" class="form-range s-g" id="G" min="0" max="255" value="120">
      <label for="B" class="form-label"><span data-i18n="cB"></span>: <b id="Bv">40</b></label>
      <input type="range" class="form-range s-b" id="B" min="0" max="255" value="40">
    </div>
    <div class="col-md-6">
      <div id="preview"></div>
      <p class="mt-3 mb-0 font-monospace" id="mixerOut"></p>
      <p class="muted small mb-0" data-i18n="cn"></p>
    </div>
  </div>
</div></section>

<section id="mix"><div class="container">
  <h2 class="mb-2" data-i18n="eh"></h2>
  <p class="muted mb-4" data-i18n="ep"></p>
  <div class="row g-3" id="examples"></div>
  <h3 class="h4 mt-5 mb-2" data-i18n="ah"></h3>
  <p class="muted" data-i18n="ap"></p>
  <div class="panel"><div class="mix-eq">
    <input type="color" id="c1" value="#ff0000" aria-label="1">
    <span class="fs-3">+</span>
    <input type="color" id="c2" value="#0000ff" aria-label="2">
    <span class="fs-3">=</span>
    <div class="chip" id="cRes" style="width:96px"></div>
    <span class="font-monospace" id="cResTxt"></span>
  </div></div>
</div></section>

<section id="wheel-sec"><div class="container">
  <h2 class="mb-2" data-i18n="lh"></h2>
  <p class="muted mb-4" data-i18n="lp"></p>
  <div class="row g-4 align-items-center">
    <div class="col-lg-5"><div class="wheel-box"><div id="wheel" role="img"></div><svg id="wsvg" viewBox="0 0 320 320"></svg></div></div>
    <div class="col-lg-7">
      <div class="d-flex flex-wrap gap-2 mb-3" id="schemes"></div>
      <div class="row g-2 mb-3" id="swatches"></div>
      <div class="panel"><h3 class="h5" id="schT"></h3><p class="mb-0 muted" id="schD"></p></div>
    </div>
  </div>
</div></section>

<footer class="container py-4 muted small" data-i18n="ft"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const T={
ru:{n1:'Что такое RGB',n2:'Смеситель',n3:'Примеры',n4:'Цветовой круг',
h1:'Три цвета света дают все остальные',hp:'Красный, зелёный и синий. Смешивая их на экране, мы получаем любой цвет, который видим. Крути круг, двигай ползунки и смотри, как это работает.',hb:'Смешать цвета',
wh:'Что такое RGB',w1:'RGB — это <b>R</b>ed, <b>G</b>reen, <b>B</b>lue: красный, зелёный, синий. Экран состоит из крошечных точек, и каждая светится этими тремя цветами.',w2:'Яркость каждого задаётся числом от <b>0</b> до <b>255</b>. Например, <code>rgb(255, 255, 0)</code> — красный и зелёный на максимум, получается жёлтый.',w3:'Это <b>аддитивное смешение</b>: свет складывается. Все три на максимум дают белый, все выключены — чёрный.',

lh:'Цветовой круг и гармонии',lp:'Нажми на круг, чтобы выбрать главный цвет. Фигура внутри покажет, какие цвета с ним сочетаются.',
s_comp:'Комплементарная',d_comp:'Два цвета напротив друг друга. Самый сильный контраст. Сложенные светом, они дают белый.',
s_tri:'Триада',d_tri:'Три цвета на равном расстоянии, вершины треугольника, как на фото. Яркая и сбалансированная палитра. Чистая RGB-триада: красный, зелёный, синий.',

wh:'RGB nima',w1:'RGB — bu <b>R</b>ed, <b>G</b>reen, <b>B</b>lue: qizil, yashil, koʻk. Ekran mayda nuqtalardan iborat va ularning har biri shu uchta rangda yonadi.',w2:'Har birining yorqinligi <b>0</b> dan <b>255</b> gacha son bilan beriladi. Masalan, <code>rgb(255, 255, 0)</code> — qizil va yashil maksimumda, natijada sariq chiqadi.',w3:'Bu <b>additiv aralashtirish</b>: yorugʻlik qoʻshiladi. Uchalasi maksimumda — oq, uchalasi oʻchiq — qora.',

h1:'Three colors of light make all the others',hp:'Red, green and blue. By mixing them on a screen we get every color we can see. Spin the wheel, move the sliders and watch how it works.',hb:'Mix colors',

const $=id=>document.getElementById(id);
const clamp=n=>Math.max(0,Math.min(255,n));
const hx=(r,g,b)=>'#'+[r,g,b].map(v=>clamp(Math.round(v)).toString(16).padStart(2,'0')).join('');
const fromHex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
let L=store.get('lang')||((navigator.language||'').startsWith('uz')?'uz':(navigator.language||'').startsWith('ru')?'ru':'en');
const t=k=>T[L][k];

/* animations: scroll progress, navbar, reveal */
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12});
function reveal(){document.querySelectorAll('section h2,section p.muted,.panel,.wheel-box,.swatch,#examples>div,#mixer .col-md-6').forEach((e,i)=>{if(!e.dataset.rv){e.dataset.rv=1;e.classList.add('rv');e.style.transitionDelay=(i%4)*70+'ms';io.observe(e)}})}
addEventListener('scroll',()=>{const h=document.documentElement;$('bar').style.transform=`scaleX(${scrollY/(h.scrollHeight-innerHeight||1)})`;document.querySelector('.navbar').classList.toggle('scrolled',scrollY>20)},{passive:true});

/* theme */
function setTheme(m){document.documentElement.dataset.bsTheme=m;$('theme').textContent=m==='dark'?'☾':'☀';store.set('theme',m)}
$('theme').onclick=()=>setTheme(document.documentElement.dataset.bsTheme==='dark'?'light':'dark');
setTheme(store.get('theme')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'));

/* mixer */
function mixer(){const r=+$('R').value,g=+$('G').value,b=+$('B').value;
$('Rv').textContent=r;$('Gv').textContent=g;$('Bv').textContent=b;
const c=`rgb(${r},${g},${b})`;$('preview').style.background=c;$('preview').style.boxShadow=`0 0 50px ${c}`;
$('mixerOut').textContent=`rgb(${r}, ${g}, ${b})  ${hx(r,g,b)}`}
['R','G','B'].forEach(i=>$(i).oninput=mixer);

/* examples */
const ex=[['cR',[255,0,0],'cG',[0,255,0]],['cG',[0,255,0],'cB',[0,0,255]],['cR',[255,0,0],'cB',[0,0,255]],['cR',[255,0,0],'cC',[0,255,255],1],['cY',[255,255,0],'cB',[0,0,255],1],['cR',[255,0,0],'cG',[0,255,0],0,'cB',[0,0,255]]];
const nameOf={'#ffff00':'cY','#00ffff':'cC','#ff00ff':'cM','#ffffff':'cW'};
function examples(){$('examples').innerHTML=ex.map(([n1,a,n2,b,comp,n3,c])=>{
const s=[0,1,2].map(i=>a[i]+b[i]+(c?c[i]:0)),col=hx(...s);
const names=[n1,n2,n3].filter(Boolean).map(t).join(' + ');
const chips=[a,b,c].filter(Boolean).map(x=>`<div class="chip" style="background:${hx(...x)}"></div>`).join('<span class="fs-4">+</span>');
return `<div class="col-md-6 col-lg-4"><div class="panel"><div class="d-flex align-items-center gap-2 mb-3">${chips}<span class="fs-4">=</span><div class="chip" style="background:${col}"></div></div><b>${names}</b><div class="muted">${t(nameOf[col])} <span class="font-monospace">${col}</span></div>${comp?`<div class="small muted mt-1">${t('cp')}</div>`:''}</div></div>`}).join('');reveal()}
function pair(){const a=fromHex($('c1').value),b=fromHex($('c2').value),c=hx(a[0]+b[0],a[1]+b[1],a[2]+b[2]);$('cRes').style.background=c;$('cResTxt').textContent=c}
['c1','c2'].forEach(i=>$(i).oninput=pair);

/* wheel */
const hue=h=>{h=((h%360)+360)%360;const f=n=>{const k=(n+h/30)%12;return .5-.25*Math.max(-1,Math.min(k-3,9-k,1))};return hx(255*f(0),255*f(8),255*f(4))};
const S={comp:[0,180],tri:[0,120,240],analog:[-30,0,30],split:[0,150,210],tetra:[0,90,180,270]};
let H=0,sc='tri';
$('schemes').onclick=e=>{const k=e.target.dataset.k;if(k){sc=k;wheel()}};
function schemeBtns(){$('schemes').innerHTML=Object.keys(S).map(k=>`<button class="pill" data-k="${k}">${t('s_'+k)}</button>`).join('')}
function wheel(){const C=160,R=124,pts=S[sc].map(o=>{const h=H+o,a=h*Math.PI/180;return{x:C+R*Math.sin(a),y:C-R*Math.cos(a),hex:hue(h)}});
const sh=pts.length>2?`<polygon points="${pts.map(p=>p.x+','+p.y).join(' ')}" fill="rgba(255,255,255,.1)" stroke="#fff" stroke-width="2"/>`:`<line x1="${pts[0].x}" y1="${pts[0].y}" x2="${pts[1].x}" y2="${pts[1].y}" stroke="#fff" stroke-width="2"/>`;
$('wsvg').innerHTML=sh+pts.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="11" fill="${p.hex}" stroke="#fff" stroke-width="3"/>`).join('');
$('swatches').innerHTML=pts.map(p=>`<div class="col"><div class="swatch in" style="background:${p.hex}">${p.hex}</div></div>`).join('');
$('schT').textContent=t('s_'+sc);$('schD').textContent=t('d_'+sc);
document.querySelectorAll('#schemes .pill').forEach(b=>b.classList.toggle('active',b.dataset.k===sc))}
$('wheel').onclick=e=>{const r=e.currentTarget.getBoundingClientRect();H=(Math.atan2(e.clientX-r.left-r.width/2,-(e.clientY-r.top-r.height/2))*180/Math.PI+360)%360;wheel()};

/* language */
function lang(l){L=l;store.set('lang',l);document.documentElement.lang=l;
document.querySelectorAll('[data-i18n]').forEach(e=>e.innerHTML=t(e.dataset.i18n));
document.title='RGB — '+t('h1');
document.querySelectorAll('#langs .pill').forEach(b=>b.classList.toggle('active',b.dataset.l===l));
examples();schemeBtns();wheel()}
$('langs').onclick=e=>{if(e.target.dataset.l)lang(e.target.dataset.l)};

mixer();pair();lang(L);reveal();
</script>
</body>
</html>
